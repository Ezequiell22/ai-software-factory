name: Runtime Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "ai-software-factory/**"
      - ".github/workflows/runtime-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env
        working-directory: ai-software-factory
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=ai_factory
          POSTGRES_USER=ai_factory
          POSTGRES_PASSWORD=ai_factory
          APP_TIMEZONE=America/Sao_Paulo
          WORK_START_HOUR=7
          WORK_END_HOUR=19
          RECONCILIATION_SECONDS=60
          MAX_REFINEMENT_CYCLES=3
          JIRA_BASE_URL=
          JIRA_EMAIL=
          JIRA_API_TOKEN=
          JIRA_PROJECT_KEY=AIPTO
          JIRA_IDEA_JQL=project = AIPTO AND status = Idea
          OPENAI_API_KEY=
          OPENAI_MODEL=gpt-5.6
          EOF

      - name: Build and start
        working-directory: ai-software-factory
        run: docker compose up --build -d

      - name: Wait for API
        working-directory: ai-software-factory
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Validate agents
        run: |
          curl -fsS http://localhost:8080/agents > /tmp/agents.json
          cat /tmp/agents.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/agents.json'))
          names={x['name'] for x in data}
          required={'intake','pm','po','pmo','refinement','story_reviewer','ux_ui','sap_b1','agrotis','accounting'}
          missing=required-names
          assert not missing, f"Missing agents: {sorted(missing)}"
          print("agents_ok", sorted(required))
          PY

      - name: Validate Postgres schema
        working-directory: ai-software-factory
        run: |
          docker compose exec -T db psql -U ai_factory -d ai_factory -c "\\dt"
          docker compose exec -T db psql -U ai_factory -d ai_factory -c "select column_name from information_schema.columns where table_name='workflows' order by ordinal_position;"

      - name: Show logs on failure
        if: failure()
        working-directory: ai-software-factory
        run: docker compose logs

      - name: Shutdown
        if: always()
        working-directory: ai-software-factory
        run: docker compose down -v
